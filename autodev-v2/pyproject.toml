[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodev"
version = "0.0.0"
description = "AutoDev V2 scaffold and fail-closed CLI placeholders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autodev = "autodev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
