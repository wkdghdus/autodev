        - unittest
      cwd: .
      input_paths:
        - src
        - tests
      network_policy: none
      timeout_seconds: 120
      approval_binding: approval/unit
  acceptance_sources:
    - milestones/AD-01.md
  require_independent_review: true
authority:
  requested:
    repo_write: human
    external_message: denied
